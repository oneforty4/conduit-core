<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sandbox</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #101014;
      }
      /* RenderHost sizes the drawing buffer from the canvas's CSS size. */
      #view {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      .panel {
        position: fixed;
        margin: 0;
        padding: 6px 10px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.6);
        color: #e8e8e8;
        font:
          12px/1.4 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      #hud {
        top: 8px;
        left: 8px;
        display: grid;
        grid-template-columns: auto auto;
        gap: 2px 10px;
        pointer-events: none;
      }
      #hud dt {
        color: #9a9aa4;
      }
      #hud dd {
        margin: 0;
      }
      /* The region counts, then the ids by status: one line each, wrapped. */
      #hud-regions {
        max-width: min(420px, calc(100vw - 110px));
        white-space: pre-line;
      }
      #hud-flash {
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 16px;
        background: rgba(255, 200, 40, 0.9);
        color: #101014;
        font-size: 16px;
        font-weight: bold;
        opacity: 0;
        transition: opacity 0.4s ease-out;
        pointer-events: none;
      }
      #hud-flash.on {
        opacity: 1;
        transition: none;
      }
      #chat {
        left: 8px;
        bottom: 8px;
        width: min(360px, calc(100% - 36px));
      }
      #chat-log {
        max-height: 160px;
        margin: 0 0 6px;
        padding: 0;
        overflow-y: auto;
        list-style: none;
        overflow-wrap: anywhere;
      }
      #chat-input {
        box-sizing: border-box;
        width: 100%;
        padding: 4px 6px;
        border: 1px solid #44444c;
        border-radius: 3px;
        background: rgba(0, 0, 0, 0.5);
        color: inherit;
        font: inherit;
      }
      #help {
        right: 8px;
        bottom: 8px;
        color: #9a9aa4;
        pointer-events: none;
      }
      /* Host mode (menu.ts): the lobby menu covers the page until a session is joined. */
      body[data-view='menu'] #hud,
      body[data-view='menu'] #hud-flash,
      body[data-view='menu'] #chat,
      body[data-view='menu'] #help {
        display: none;
      }
      #menu {
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        box-sizing: border-box;
        width: min(560px, calc(100vw - 32px));
        max-height: calc(100vh - 32px);
        overflow-y: auto;
        padding: 12px 16px;
        font-size: 13px;
      }
      #menu[hidden],
      #menu [hidden],
      #invite[hidden] {
        display: none;
      }
      #menu h1,
      #menu h2 {
        margin: 8px 0 6px;
        font-size: 14px;
      }
      #menu form {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 4px 8px;
        align-items: center;
        margin: 0 0 12px;
      }
      #menu form h2,
      #menu form button {
        grid-column: 1 / -1;
      }
      #menu form button {
        justify-self: start;
      }
      #menu input,
      #menu select,
      #menu button {
        box-sizing: border-box;
        padding: 3px 6px;
        border: 1px solid #44444c;
        border-radius: 3px;
        background: rgba(0, 0, 0, 0.5);
        color: inherit;
        font: inherit;
      }
      #menu button {
        cursor: pointer;
      }
      #menu-status:empty {
        display: none;
      }
      #menu-status[data-error] {
        color: #ff8a80;
      }
      #sessions {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      #sessions li {
        padding: 4px 0;
        border-top: 1px solid #2c2c34;
        overflow-wrap: anywhere;
      }
      #sessions code {
        color: #ffd54f;
      }
      #invite {
        top: 8px;
        right: 8px;
        max-width: calc(100vw - 40px);
        overflow-wrap: anywhere;
      }
      #invite a {
        color: #82b1ff;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <dl id="hud" class="panel">
      <dt>state</dt>
      <dd id="hud-state">idle</dd>
      <dt>tick</dt>
      <dd id="hud-tick">-</dd>
      <dt>rtt</dt>
      <dd id="hud-rtt">-</dd>
      <dt>entities</dt>
      <dd id="hud-entities">-</dd>
      <dt>regions</dt>
      <dd id="hud-regions">-</dd>
      <dt>bytes</dt>
      <dd id="hud-bytes">-</dd>
      <dt>joins</dt>
      <dd id="hud-joins">-</dd>
    </dl>
    <div id="hud-flash" class="panel" role="status"></div>
    <div id="chat" class="panel">
      <ol id="chat-log" aria-live="polite"></ol>
      <input
        id="chat-input"
        type="text"
        maxlength="200"
        autocomplete="off"
        placeholder="Enter to chat"
      />
    </div>
    <p id="help" class="panel">
      WASD drive · Space horn · O orbit camera · B region bounds · Enter chat
    </p>
    <p id="invite" class="panel" hidden></p>
    <section id="menu" class="panel" aria-label="Lobby" hidden>
      <h1>sandbox lobby</h1>
      <p id="menu-status" role="status"></p>
      <div id="menu-signed-out">
        <form id="register">
          <h2>Register</h2>
          <label for="register-username">Username</label>
          <input id="register-username" name="username" autocomplete="username" required />
          <label for="register-password">Password</label>
          <input
            id="register-password"
            name="password"
            type="password"
            autocomplete="new-password"
            required
          />
          <label for="register-display-name">Display name</label>
          <input id="register-display-name" name="displayName" maxlength="32" />
          <button type="submit">Register and log in</button>
        </form>
        <form id="login">
          <h2>Log in</h2>
          <label for="login-username">Username</label>
          <input id="login-username" name="username" autocomplete="username" required />
          <label for="login-password">Password</label>
          <input
            id="login-password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
          <button type="submit">Log in</button>
        </form>
      </div>
      <div id="menu-signed-in" hidden>
        <p>
          Signed in as <span id="menu-account"></span>
          <button id="logout" type="button">Log out</button>
        </p>
        <form id="create">
          <h2>Create a session</h2>
          <label for="create-name">Name</label>
          <input id="create-name" name="name" maxlength="48" required />
          <label for="create-visibility">Visibility</label>
          <select id="create-visibility" name="visibility">
            <option value="private">private (invite code)</option>
            <option value="friends">friends</option>
            <option value="public">public</option>
          </select>
          <label for="create-max-players">Max players</label>
          <input
            id="create-max-players"
            name="maxPlayers"
            type="number"
            min="1"
            max="8"
            value="4"
            required
          />
          <button type="submit">Create</button>
        </form>
        <form id="join">
          <h2>Join by invite code</h2>
          <label for="join-session">Session id</label>
          <input id="join-session" name="session" autocomplete="off" required />
          <label for="join-code">Invite code</label>
          <input id="join-code" name="code" autocomplete="off" />
          <button type="submit">Join</button>
        </form>
        <h2>Sessions <button id="refresh" type="button">Refresh</button></h2>
        <ul id="sessions"></ul>
      </div>
    </section>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
